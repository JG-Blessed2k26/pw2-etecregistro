<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
</body>
<script>
const n1 = window.prompt('Digite um número')
const n2 = window.prompt('Digite outro número')

const soma = n1 * 1 + n2 * 1
const subtracao = n1 * 1 - n2 * 1
const multiplicacao = n1 * 1 * n2 * 1
const divisao = n1 * 1 / n2 * 1

document.write(`A soma de ${n1} e ${n2} é igual a ${soma} <br>`)
document.write(`A subtração de ${n1} e ${n2} é igual a ${subtracao} <br>`)
document.write(`A multiplicação de ${n1} e ${n2} é igual a ${multiplicacao} <br>`)
document.write(`A divisão de ${n1} e ${n2} é igual a ${divisao} <br>`)
</script>
</html>
